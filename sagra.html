<!DOCTYPE html><html class="light" lang="it"><head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://cloudflareinsights.com https://static.cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Salviamo i Castagni</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#E0A32E">

<!-- Pagina-ponte del QR della sagra.
     Esiste come URL a sé per il tracciamento: le visite a /sagra.html sono,
     una per una, scansioni del QR alla festa — nessun'altra sorgente ci arriva.
     Registrato il passaggio, porta subito in home.
     Se cambia il volantino NON cambiare questo indirizzo: i QR sono già stampati. -->

<!-- Chi ha JS disattivato arriva comunque, con 2s di ritardo -->
<noscript><meta http-equiv="refresh" content="2;url=index.html?da=sagra"></noscript>

<style>
  html,body{margin:0;height:100%}
  body{background:#42240D;color:#F3E4D2;display:flex;align-items:center;justify-content:center;
       font-family:ui-sans-serif,system-ui,-apple-system,"Work Sans",sans-serif;text-align:center;padding:1.5rem}
  .w{max-width:22rem}
  .n{font-size:2.6rem;line-height:1;margin-bottom:1rem}
  h1{font-size:1.15rem;font-weight:600;margin:0 0 .4rem}
  p{font-size:.9rem;opacity:.75;margin:0 0 1.4rem}
  .bar{height:4px;border-radius:999px;background:rgba(255,255,255,.16);overflow:hidden}
  .bar i{display:block;height:100%;width:40%;border-radius:999px;
         background:linear-gradient(90deg,#E0A32E,#C26A2E);animation:run 1s ease-in-out infinite}
  @keyframes run{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
  a{color:#E8C89A}
  @media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>
</head>
<body>
  <div class="w">
    <div class="n" aria-hidden="true">🌰</div>
    <h1>Salviamo i Castagni</h1>
    <p>Ti stiamo portando al progetto…</p>
    <div class="bar" role="progressbar" aria-label="Caricamento"><i></i></div>
    <p style="margin-top:1.4rem"><a href="index.html?da=sagra">Se non succede nulla, tocca qui</a></p>
  </div>

<!-- Cloudflare Web Analytics: deve partire PRIMA del redirect, altrimenti
     la scansione non viene contata ed è il dato che ci serve. -->
<script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "a76b0ec168c34e6faf72ae3f30f33e5b"}'></script>
<script>
  (function () {
    var andato = false;
    function vai() {
      if (andato) return;
      andato = true;
      location.replace('index.html?da=sagra');
    }
    // il beacon parte al load: lasciamogli un attimo, poi via
    window.addEventListener('load', function () { setTimeout(vai, 400); });
    // rete lenta o beacon bloccato da un adblocker: non restare impiccati
    setTimeout(vai, 2500);
  })();
</script>
</body></html>
