# Porta gli ultimi reel di Instagram dentro il sito, ogni 6 ore.
# Il sito non chiama mai Instagram dal browser: legge solo file suoi.
name: Sync Instagram

on:
  schedule:
    - cron: '17 */6 * * *'      # 6 volte al giorno, a minuti "dispari" per non fare la fila
  workflow_dispatch:            # bottone "Run workflow" per forzare a mano

permissions:
  contents: write

concurrency:
  group: social-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pillow

      - name: Scarica gli ultimi post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python tools/fetch_instagram.py

      - name: Pubblica se e' cambiato qualcosa
        run: |
          if [ -z "$(git status --porcelain assets/social.json assets/img/social)" ]; then
            echo "Nessuna novita' su Instagram."
            exit 0
          fi
          git config user.name  "salviamoicastagni-bot"
          git config user.email "bot@salviamoicastagni.it"
          git add assets/social.json assets/img/social
          git commit -m "Social: aggiornati gli ultimi post da Instagram"
          git push
